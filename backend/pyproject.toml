[project]
name = "ai-chargeback-risk-evidence-response-agent-backend"
version = "0.1.0"
description = "FastAPI backend foundation for the AI Chargeback Risk & Evidence Response Agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "sqlalchemy>=2.0.40,<3.0.0",
    "faker>=24.0.0,<25.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "xgboost>=2.0.0,<4.0.0",
    "joblib>=1.4.0,<2.0.0",
    "google-genai>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
